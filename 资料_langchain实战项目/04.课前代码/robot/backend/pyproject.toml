[project]
name = "backend"
version = "0.1.0"
description = "Chatbot backend with FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymysql>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0,<5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
